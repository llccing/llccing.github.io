name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  # Commits pushed with GITHUB_TOKEN do not emit another push workflow. Run
  # deployment explicitly after the digest workflow completes successfully.
  workflow_run:
    workflows:
      - Daily Tech Digest
    types:
      - completed

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          PUBLIC_INLINE_COMMENTS: "true"
          PUBLIC_COMMENTS_API_URL: https://rowan-blog-comments.lcf33123.workers.dev

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: "rowanliu.com"
