name: Daily Tech Digest

on:
  schedule:
    # 02:00 UTC = 10:00 Asia/Shanghai. The generator anchors the entry date to
    # Shanghai time, so this lands the digest on the correct local day.
    - cron: "0 2 * * *"

  # Manual trigger for testing. --force lets a re-run overwrite today's entry.
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite today's entry if it already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# A scheduled run and a manual run must not push to main at the same time.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BLOG_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate digest
        env:
          # Keep local generation as the rollback default until the Worker has
          # been deployed and a canary run has passed.
          DIGEST_BACKEND: ${{ secrets.DIGEST_BACKEND || 'local' }}
          DIGEST_WORKER_URL: ${{ secrets.DIGEST_WORKER_URL }}
          DIGEST_TRIGGER_TOKEN: ${{ secrets.DIGEST_TRIGGER_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # Lifts the anonymous GitHub API rate limit while fetching releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/digest/generate.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # No digest file means there was nothing new today. That is a normal
      # outcome, not a failure: skip validation and commit rather than error.
      - name: Check for changes
        id: changes
        run: |
          if git status --porcelain src/content/digest | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new digest entry today."
          fi

      # A malformed entry must fail the run, not get committed. This is the
      # guard the old post generator lacked, which let an empty file ship.
      - name: Validate content
        if: steps.changes.outputs.changed == 'true'
        run: pnpm check:content

      # Author is me so the commit counts toward my contribution graph — GitHub
      # credits the author email, and it has to be one linked to my account.
      # Committer stays the bot, so the commit reads "rowan authored and
      # github-actions[bot] committed" and stays distinguishable from hand work.
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: "Rowan Liu"
          GIT_AUTHOR_EMAIL: "lcf33123@gmail.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git add src/content/digest
          # Do not add a CI skip token here. Cloudflare Pages honors it too,
          # which leaves the generated digest committed but unpublished.
          git commit \
            -m "chore(digest): add daily tech digest" \
            -m "Generated automatically by the Daily Tech Digest workflow." \
            -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin HEAD:main
